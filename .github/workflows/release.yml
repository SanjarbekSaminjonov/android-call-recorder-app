name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          APK_NAME="SecureCallRecorder-${TAG_NAME}.apk"
          
          # Copy signed release APK
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/${APK_NAME}"
          
          # Generate SHA256 checksum for cryptographic verification
          cd release-artifacts
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          cd ..
          
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Secure Call Recorder ${{ steps.prepare_artifacts.outputs.tag_name }}"
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
